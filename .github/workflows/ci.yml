name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # required by go-ci.yml's gosec SARIF upload
  security-events: write

jobs:
  # ─── Go Build & Test ────────────────────────────────────────────────
  # test, lint, verify and security now come from the shared workflow. It
  # probes for Makefile targets per step and falls back to the plain go
  # commands these jobs used to run inline.
  ci:
    uses: xraph/workflows/.github/workflows/go-ci.yml@v1
    with:
      go-versions: '["1.25"]'
      os: '["ubuntu-latest"]'

  # ─── Driver Sub-Modules ──────────────────────────────────────────────
  drivers:
    name: Driver (${{ matrix.driver }})
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        driver:
          - azuredriver
          - gcsdriver
          - s3driver
          - sftpdriver

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: drivers/${{ matrix.driver }}/go.sum

      - name: Download modules
        working-directory: drivers/${{ matrix.driver }}
        run: go mod download

      - name: Verify module tidy
        working-directory: drivers/${{ matrix.driver }}
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        working-directory: drivers/${{ matrix.driver }}
        run: go build ./...

      - name: Test
        working-directory: drivers/${{ matrix.driver }}
        run: go test -race -count=1 ./...

      # govulncheck resolves imports per module, so the shared go-ci.yml
      # `security` job — which runs at the repository root — never sees these
      # sub-modules at all. Every third-party dependency the project ships
      # lives here, so without this step they were entirely unscanned.
      #
      # Module findings gate; standard-library findings only report. A stdlib
      # finding tracks the runner's Go patch release rather than anything in
      # this repository, so gating on it reds every branch whenever a new Go
      # release lands, regardless of whether this code is affected.
      - name: Vulnerability scan (govulncheck)
        working-directory: drivers/${{ matrix.driver }}
        env:
          GOVULNCHECK_VERSION: v1.6.0
          DRIVER: ${{ matrix.driver }}
          ALLOWLIST: ${{ github.workspace }}/.github/govulncheck-allowlist.txt
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"

          REPORT="$RUNNER_TEMP/govulncheck-$DRIVER.json"
          # JSON mode is for programmatic use and does not signal findings
          # through its exit code; the parse below is what decides.
          govulncheck -format json ./... > "$REPORT" || true

          # A finding gates only when its trace reaches a called symbol.
          # Findings at module or package level mean the dependency is present
          # but the vulnerable code is never invoked.
          reachable() {
            jq -sr --arg scope "$1" '
              [ .[]
                | select(has("finding")) | .finding
                | select(.trace[0].function != null)
                | select(if $scope == "stdlib"
                         then .trace[0].module == "stdlib"
                         else .trace[0].module != "stdlib" end)
                | .osv ] | unique | .[]
            ' "$REPORT"
          }

          STDLIB=$(reachable stdlib)
          MODULE=$(reachable module)
          ALLOWED=$(grep -E "^$DRIVER[[:space:]]" "$ALLOWLIST" 2>/dev/null | awk '{print $2}' | sort -u || true)
          NEW=$(comm -23 <(printf '%s\n' "$MODULE" | sed '/^$/d') <(printf '%s\n' "$ALLOWED" | sed '/^$/d'))

          if [ -n "$STDLIB" ]; then
            echo "- \`$DRIVER\` stdlib (toolchain, not gating): $(echo $STDLIB)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ALLOWED" ]; then
            echo "- \`$DRIVER\` known backlog (allowlisted): $(echo $ALLOWED)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$NEW" ]; then
            echo "- \`$DRIVER\` **new reachable dependency vulnerabilities**: $(echo $NEW)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::new reachable dependency vulnerabilities in $DRIVER: $(echo $NEW)"
            echo "Fix by upgrading the dependency. To accept it for now, add it to"
            echo ".github/govulncheck-allowlist.txt with a reason."
            govulncheck ./... || true
            exit 1
          fi

          echo "- \`$DRIVER\`: no new reachable dependency vulnerabilities" >> "$GITHUB_STEP_SUMMARY"

  # ─── Extension Module ─────────────────────────────────────────────────
  extension:
    name: Extension
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: extension/go.mod
          cache: true
          cache-dependency-path: extension/go.sum

      - name: Download modules
        working-directory: extension
        run: go mod download

      - name: Verify module tidy
        working-directory: extension
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        working-directory: extension
        run: go build ./...

  # ─── Bench Module ────────────────────────────────────────────────────
  bench:
    name: Bench
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: bench/go.mod
          cache: true
          cache-dependency-path: bench/go.sum

      - name: Download modules
        working-directory: bench
        run: go mod download

      - name: Verify module tidy
        working-directory: bench
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        working-directory: bench
        run: go build ./...

  # ─── Lint ───────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 10m

  # ─── Format Check ──────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check formatting (goimports)
        run: |
          OUTPUT=$(goimports -l -local github.com/xraph/trove .)
          if [ -n "$OUTPUT" ]; then
            echo "::error::The following files need goimports formatting:"
            echo "$OUTPUT"
            exit 1
          fi

  # ─── Docs ───────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm types:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
