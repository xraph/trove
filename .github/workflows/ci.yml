name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # required by go-ci.yml's gosec SARIF upload
  security-events: write

jobs:
  # ─── Go Build & Test ────────────────────────────────────────────────
  # test, lint, verify and security now come from the shared workflow. It
  # probes for Makefile targets per step and falls back to the plain go
  # commands these jobs used to run inline.
  ci:
    uses: xraph/workflows/.github/workflows/go-ci.yml@v1
    with:
      go-versions: '["1.25"]'
      os: '["ubuntu-latest"]'
      # The shared security job gates on any govulncheck finding, including
      # standard-library ones. Those describe the runner's Go patch release
      # rather than this repository, so every Go release red-lined main for
      # the window between the advisory landing and the toolchain reaching
      # the setup-go manifest. Nobody here could act on it, and the failure
      # cascaded: `ci` reports one conclusion for all its jobs, so the driver
      # and extension jobs skipped with it.
      #
      # gosec still gates from that job. govulncheck now gates from the
      # vulncheck job below, which reports stdlib findings and blocks only on
      # reachable third-party ones.
      govulncheck-fail-on-findings: false

  # ─── Vulnerability Gate ───────────────────────────────────────────────
  # govulncheck resolves imports per module, so the shared workflow's scan of
  # the repository root never saw the sub-modules where every third-party
  # dependency actually lives. Each module is scanned on its own here.
  vulncheck:
    name: Vulncheck (${{ matrix.module.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - {name: root, dir: .}
          - {name: extension, dir: extension}
          - {name: azuredriver, dir: drivers/azuredriver}
          - {name: gcsdriver, dir: drivers/gcsdriver}
          - {name: s3driver, dir: drivers/s3driver}
          - {name: sftpdriver, dir: drivers/sftpdriver}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module.dir }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module.dir }}/go.sum

      - name: Scan
        uses: ./.github/actions/govulncheck-gate
        with:
          module: ${{ matrix.module.dir }}
          name: ${{ matrix.module.name }}

  # ─── Driver Sub-Modules ──────────────────────────────────────────────
  drivers:
    name: Driver (${{ matrix.driver }})
    runs-on: ubuntu-latest
    # `needs: ci` orders this after the root module's checks, but a reusable
    # workflow reports one conclusion for all of its jobs — so any failure
    # inside it, including a govulncheck finding about the runner's Go patch
    # release, skipped this job entirely. These are independent modules whose
    # build and tests have nothing to do with the root module's scan result,
    # and a skipped job reports as neither pass nor fail, so the coverage
    # disappeared silently. Run unless the workflow was actually cancelled.
    if: ${{ !cancelled() }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        driver:
          - azuredriver
          - gcsdriver
          - s3driver
          - sftpdriver

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Each driver declares its own minimum, so read the version from the
          # module being built rather than from the root. sftpdriver needs
          # 1.26.0 for x/crypto v0.56.0 while the root still declares 1.25.7,
          # and a toolchain older than the module asks for either downloads a
          # second one mid-job or fails outright, depending on GOTOOLCHAIN.
          go-version-file: drivers/${{ matrix.driver }}/go.mod
          cache: true
          cache-dependency-path: drivers/${{ matrix.driver }}/go.sum

      - name: Download modules
        working-directory: drivers/${{ matrix.driver }}
        run: go mod download

      - name: Verify module tidy
        working-directory: drivers/${{ matrix.driver }}
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        working-directory: drivers/${{ matrix.driver }}
        run: go build ./...

      - name: Test
        working-directory: drivers/${{ matrix.driver }}
        run: go test -race -count=1 ./...

  # ─── Extension Module ─────────────────────────────────────────────────
  extension:
    name: Extension
    runs-on: ubuntu-latest
    # See the drivers job: a reusable-workflow failure must not silently
    # skip an independent module's tests.
    if: ${{ !cancelled() }}
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: extension/go.mod
          cache: true
          cache-dependency-path: extension/go.sum

      - name: Download modules
        working-directory: extension
        run: go mod download

      - name: Verify module tidy
        working-directory: extension
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        working-directory: extension
        run: go build ./...

      # The extension module was built but never tested, so extension/handler's
      # tests — including the HTTP status mapping and error-disclosure tests
      # added with this change — would have compiled in CI and never run.
      - name: Test
        working-directory: extension
        run: go test -race -count=1 ./...

  # ─── Bench Module ────────────────────────────────────────────────────
  bench:
    name: Bench
    runs-on: ubuntu-latest
    # See the drivers job.
    if: ${{ !cancelled() }}
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: bench/go.mod
          cache: true
          cache-dependency-path: bench/go.sum

      - name: Download modules
        working-directory: bench
        run: go mod download

      - name: Verify module tidy
        working-directory: bench
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        working-directory: bench
        run: go build ./...

  # ─── Lint ───────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # See the drivers job.
    if: ${{ !cancelled() }}
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 10m

  # ─── Format Check ──────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check formatting (goimports)
        run: |
          OUTPUT=$(goimports -l -local github.com/xraph/trove .)
          if [ -n "$OUTPUT" ]; then
            echo "::error::The following files need goimports formatting:"
            echo "$OUTPUT"
            exit 1
          fi

  # ─── Docs ───────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm types:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
